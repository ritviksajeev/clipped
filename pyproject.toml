[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipped"
version = "0.1.1"
description = "Local-first Twitch clips to YouTube Shorts pipeline with burned-in captions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.6",
  "yt-dlp>=2024.10.0",
  "faster-whisper>=1.0",
  "keyring>=25",
  "platformdirs>=4",
  "pillow>=10",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "anthropic>=2.10",
  "tzdata>=2024.1",  # time-zone database for zoneinfo; Windows has none built in
  # The native app window (WebView2 on Windows, WebKit on macOS) and the
  # Windows tray icon. Linux uses an Edge/Chrome app window instead.
  "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",
  "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "markdown>=3.5", "pyinstaller>=6.6"]

[project.scripts]
clipped = "clipped.cli:main"

[tool.setuptools.packages.find]
include = ["clipped*"]

[tool.setuptools.package-data]
clipped = ["assets/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ffmpeg: needs ffmpeg with libass on PATH"]
asyncio_default_fixture_loop_scope = "function"
