[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clippilot"
version = "0.1.0"
description = "Local-first Twitch clips to YouTube Shorts pipeline with burned-in captions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.6",
  "yt-dlp>=2024.10.0",
  "faster-whisper>=1.0",
  "keyring>=25",
  "platformdirs>=4",
  "pillow>=10",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "anthropic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "markdown>=3.5", "pyinstaller>=6.6"]

[project.scripts]
clippilot = "clippilot.cli:main"

[tool.setuptools.packages.find]
include = ["clippilot*"]

[tool.setuptools.package-data]
clippilot = ["assets/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ffmpeg: needs ffmpeg with libass on PATH"]
asyncio_default_fixture_loop_scope = "function"
