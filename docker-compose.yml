services:
  clipped:
    build: .
    image: clipped:latest
    container_name: clipped
    # Published on 127.0.0.1 only: the dashboard is not reachable from your network.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - clipped-data:/data
    restart: unless-stopped

volumes:
  clipped-data:
